<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Victorian Train Tracker</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
                <h1 class="my-4">Victorian Train Tracker</h1>
            </header>
            <section class="row">
                <h2 class="my-2">Settings</h2>
                <div class="row">
                    <div class="col-12 col-md-8"><h3 class="my-1">LED drivers</h3></div>
                    <div class="col form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="driver">
                        <label class="form-check-label" for="driver" id="driver_lbl"></label>
                    </div>
                    <div class="col-12 col-md-8"><h3 class="my-1">Lines</h3></div>
                    <div class="col">
                        <div class="btn-group" role="group" aria-label="Toggle all lines">
                            <button type="button" class="btn btn-success" onclick="enableAll()">Enable all</button>
                            <button type="button" class="btn btn-danger" onclick="disableAll()">Disable all</button>
                        </div>
                    </div>
                </div>
                <div id="lines" class="row"></div>
            </section>
            <section class="row">
                <h2 class="my-2">LED Buffer View</h2>
                <iframe src="board.htm" width="100%" scrolling="no" id="bview"></iframe>
            </section>
            <section class="row">
                <h2 class="my-2">Information</h2>
                <table class="table">
                    <tbody>
                        <tr>
                            <th scope="row">Connected Wi-Fi SSID</th>
                            <td id="ssid"></td>
                        </tr>
                        <tr>
                            <th scope="row">Station mode MAC address</th>
                            <td id="sta_mac"></td>
                        </tr>
                        <tr>
                            <th scope="row">AP mode MAC address</th>
                            <td id="ap_mac"></td>
                        </tr>
                        <tr>
                            <th scope="row">Build timestamp</th>
                            <td id="buildtime"></td>
                        </tr>
                        <tr>
                            <th scope="row">Uptime</th>
                            <td id="uptime"></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
        <script>
            const host = window.location.hostname;
            const lines = {
                SHM: "Sandringham",
                MDD: "Mernda",
                HBE: "Hurstbridge",
                CCL: "City Circle",
                PKM: "Pakenham",
                CBE: "Cranbourne",
                BEG: "Belgrave",
                LIL: "Lilydale",
                GWY: "Glen Waverley",
                ALM: "Alamein",
                STY: "Stony Point",
                FKN: "Frankston",
                WIL: "Williamstown",
                WER: "Werribee",
                CGB: "Craigieburn",
                SUY: "Sunbury",
                RCE: "Flemington Racecourse",
                UFD: "Upfield",
                ART: "Ararat via Melton",
                BAT: "Ballarat via Melton",
                MBY: "Maryborough via Melton",
                BDE: "Bairnsdale via Pakenham",
                TRN: "Traralgon via Pakenham",
                GEL: "Geelong via Wyndham Vale",
                WBL: "Warrnambool via Wyndham Vale",
                BGO: "Bendigo via Sunbury",
                SWL: "Swan Hill via Sunbury",
                ECH: "Echuca via Sunbury",
                SER: "Seymour via Craigieburn",
                SNH: "Shepparton via Craigieburn",
                ABY: "Albury via Craigieburn"
            };
            const lineBoxes = document.getElementById('lines');
            const enableLine = (line) => fetch(`http://${host}/lines?l=${line}`, {method: 'PUT'});
            const disableLine = (line) => fetch(`http://${host}/lines?l=${line}`, {method: 'DELETE'});
            for (const [key, value] of Object.entries(lines)) {
                const id = `line_${key}`;
                lineBoxes.innerHTML += `<div class="col-12 col-md-6 col-lg-4 col-xl-3 text-center my-1"><input type="checkbox" id="${id}" name="${id}" class="btn-check" autocomplete="off"><label for="${id}" class="btn btn-outline-primary">${value}</label></div>`;
            }
            const board = document.getElementById('bview');
            const updateBoardHeight = () => {
                board.style.height = board.contentWindow.document.documentElement.scrollHeight + "px";
            };
            window.addEventListener('load', updateBoardHeight);
            window.addEventListener('resize', updateBoardHeight);
            const driver = document.getElementById('driver');
            const driverLabel = document.getElementById('driver_lbl');
            window.addEventListener('load', () => {
                fetch(`http://${host}/driver`).then((resp) => resp.text()).then((data) => {
                    driver.checked = (data == 1);
                    driverLabel.innerHTML = (data == 1) ? 'On' : 'Off';
                    return fetch(`http://${host}/lines`).then((resp) => resp.text()).then((data) => {
                        data = data.split(',');
                        for (const [key, value] of Object.entries(lines)) {
                            const id = `line_${key}`;
                            const elem = document.getElementById(id);
                            if (data.includes(key)) elem.checked = true;
                            elem.addEventListener('change', (event) => {
                                if (event.currentTarget.checked) enableLine(key);
                                else disableLine(key);
                            });
                        }
                        return fetch(`http://${host}/config/wifi/ssid`).then((resp) => resp.text()).then((data) => {
                            document.getElementById('ssid').innerHTML = data;
                            return fetch(`http://${host}/config/mac/sta`).then((resp) => resp.text()).then((data) => {
                                document.getElementById('sta_mac').innerHTML = data;
                                return fetch(`http://${host}/config/mac/ap`).then((resp) => resp.text()).then((data) => {
                                    document.getElementById('ap_mac').innerHTML = data;
                                    return fetch(`http://${host}/config/build`).then((resp) => resp.text()).then((data) => {
                                        document.getElementById('buildtime').innerHTML = data;
                                        return fetch(`http://${host}/config/uptime`).then((resp) => resp.text()).then((data) => {
                                            const h = Math.floor(data / 3600);
                                            const m = Math.floor((data % 3600) / 60);
                                            const s = Math.floor(data % 60);
                                            document.getElementById('uptime').innerHTML = h + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
                                        });
                                    });
                                });
                            });
                        });
                    });
                });
            });
            const enableAll = () => enableLine('all').then(() => {
                for (const key of Object.keys(lines))
                    document.getElementById(`line_${key}`).checked = true;
            });
            const disableAll = () => disableLine('all').then(() => {
                for (const key of Object.keys(lines))
                    document.getElementById(`line_${key}`).checked = false;
            });
            driver.addEventListener('change', () => {
                driverLabel.innerHTML = (driver.checked) ? 'On' : 'Off';
                fetch(`http://${host}/driver?s=${(driver.checked) ? 1 : 0}`, {method: 'POST'});
            });
        </script>
    </body>
</html>

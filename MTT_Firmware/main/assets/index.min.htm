<!DOCTYPE html><html lang="en"><head><title>Melbourne Train Tracker</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="bootstrap.min.css" rel="stylesheet"></head><body><div class="container"><header><h1 class="my-4">Melbourne Train Tracker</h1></header><section class="row"><h2 class="my-2">Settings</h2><div class="row"><div class="col-12 col-md-8"><h3 class="my-1">LED drivers</h3></div><div class="col form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="driver"><label class="form-check-label" for="driver" id="driver_lbl"></label></div><div class="col-12 col-md-8"><h3 class="my-1">Lines</h3></div><div class="col"><div class="btn-group" role="group" aria-label="Toggle all lines"><button type="button" class="btn btn-success" onclick="enableAll()">Enable all</button><button type="button" class="btn btn-danger" onclick="disableAll()">Disable all</button></div></div></div><div id="lines" class="row"></div></section><section class="row"><h2 class="my-2">LED Buffer View</h2><iframe src="board.htm" width="100%" scrolling="no" id="bview"></iframe></section><section class="row"><h2 class="my-2">Information</h2><table class="table"><tbody><tr><th scope="row">Connected Wi-Fi SSID</th><td id="ssid"></td></tr><tr><th scope="row">Station mode MAC address</th><td id="sta_mac"></td></tr><tr><th scope="row">AP mode MAC address</th><td id="ap_mac"></td></tr><tr><th scope="row">Build timestamp</th><td id="buildtime"></td></tr><tr><th scope="row">Uptime</th><td id="uptime"></td></tr></tbody></table></section></div><script>const host=window.location.hostname,lines={SHM:"Sandringham",MDD:"Mernda",HBE:"Hurstbridge",CCL:"City Circle",PKM:"Pakenham",CBE:"Cranbourne",BEG:"Belgrave",LIL:"Lilydale",GWY:"Glen Waverley",ALM:"Alamein",STY:"Stony Point",FKN:"Frankston",WIL:"Williamstown",WER:"Werribee",CGB:"Craigieburn",SUY:"Sunbury",RCE:"Flemington Racecourse",UFD:"Upfield",ART:"Ararat via Melton",BAT:"Ballarat via Melton",MBY:"Maryborough via Melton",BDE:"Bairnsdale via Pakenham",TRN:"Traralgon via Pakenham",GEL:"Geelong via Wyndham Vale",WBL:"Warrnambool via Wyndham Vale"},lineBoxes=document.getElementById("lines"),enableLine=e=>fetch(`http://${host}/lines?l=${e}`,{method:"PUT"}),disableLine=e=>fetch(`http://${host}/lines?l=${e}`,{method:"DELETE"});for(const[e,t]of Object.entries(lines)){const n=`line_${e}`;lineBoxes.innerHTML+=`<div class="col-12 col-md-6 col-lg-4 col-xl-3 text-center my-1"><input type="checkbox" id="${n}" name="${n}" class="btn-check" autocomplete="off"><label for="${n}" class="btn btn-outline-primary">${t}</label></div>`}const board=document.getElementById("bview"),updateBoardHeight=()=>{board.setAttribute("height",board.clientWidth/423.5*402.4+"px")};window.addEventListener("load",updateBoardHeight),window.addEventListener("resize",updateBoardHeight);const driver=document.getElementById("driver"),driverLabel=document.getElementById("driver_lbl");window.addEventListener("load",(()=>{fetch(`http://${host}/driver`).then((e=>e.text())).then((e=>{driver.checked=1==e,driverLabel.innerHTML=1==e?"On":"Off"})),fetch(`http://${host}/lines`).then((e=>e.text())).then((e=>{e=e.split(",");for(const[t,n]of Object.entries(lines)){const n=`line_${t}`,i=document.getElementById(n);e.includes(t)&&(i.checked=!0),i.addEventListener("change",(e=>{e.currentTarget.checked?enableLine(t):disableLine(t)}))}})),fetch(`http://${host}/config/wifi/ssid`).then((e=>e.text())).then((e=>{document.getElementById("ssid").innerHTML=e})),fetch(`http://${host}/config/mac/sta`).then((e=>e.text())).then((e=>{document.getElementById("sta_mac").innerHTML=e})),fetch(`http://${host}/config/mac/ap`).then((e=>e.text())).then((e=>{document.getElementById("ap_mac").innerHTML=e})),fetch(`http://${host}/config/build`).then((e=>e.text())).then((e=>{document.getElementById("buildtime").innerHTML=e})),fetch(`http://${host}/config/uptime`).then((e=>e.text())).then((e=>{const t=Math.floor(e/3600),n=Math.floor(e%3600/60),i=Math.floor(e%60);document.getElementById("uptime").innerHTML=t+":"+n.toString().padStart(2,"0")+":"+i.toString().padStart(2,"0")}))}));const enableAll=()=>enableLine("all").then((()=>{for(const e of Object.keys(lines))document.getElementById(`line_${e}`).checked=!0})),disableAll=()=>disableLine("all").then((()=>{for(const e of Object.keys(lines))document.getElementById(`line_${e}`).checked=!1}));driver.addEventListener("change",(()=>{driverLabel.innerHTML=driver.checked?"On":"Off",fetch(`http://${host}/driver?s=${driver.checked?1:0}`,{method:"POST"})}));</script></body></html>
